episode: s1e01
path_name: stuck_beginner
# max_turns_per_beat: 2 means each beat needs 2 turns before auto-advancing.
# greet has no pass_if, so it advances after 2 turns via the max_turns cap.
# age has a pass_if but the player never satisfies it, so it also advances via cap.
max_turns_per_beat: 2

turns:
  # greet turn 1
  - say: "안녕하세요, 선배님!"
    expect:
      beat: greet
      register: haeyo

  # greet turn 2 — after this, beat_turns=2 >= max_turns=2, greet advances
  - say: "잘 부탁드려요, 선배님."
    expect:
      beat: greet
      register: haeyo

  # age beat turn 1: no birth year → beat_passed: false
  - say: "잘 모르겠어요."
    expect:
      beat: age
      register: haeyo
      beat_passed: false

  # age beat turn 2: still no year → max_turns reached, beat advances via fallback
  - say: "어... 모르겠어요."
    expect:
      beat: age
      register: haeyo
      beat_passed: false

  # cafeteria: mentions origin → beat_passed: true
  - say: "미국에서 왔어요."
    expect:
      beat: cafeteria
      register: haeyo
      beat_passed: true

  - say: "네, 감사합니다!"
    expect:
      beat: hook
      register: hapsyo

  # hook turn 2 — beat_turns=2 >= max_turns=2, hook advances → episode complete
  - say: "네, 열심히 해볼게요."
    expect:
      beat: hook
      register: haeyo

end_expect:
  episode_complete: true
  beats_reached: [greet, age, cafeteria, hook]
