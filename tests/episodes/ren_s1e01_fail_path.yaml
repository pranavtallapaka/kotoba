episode: ren_s1e01
path_name: fail_path
max_turns_per_beat: 1

turns:
  # plain form before tameguchi offer — offense: mild, respect drops
  - say: "よろしく。隣に引っ越したんだ。"
    expect:
      beat: greet
      register: plain
      offense: mild
      respect_change: negative

  # intro: vague — no name given → beat_passed: false → on_fail fires (closeness -1)
  - say: "よくわかりません。"
    expect:
      beat: intro
      register: desu_masu
      beat_passed: false

  # small_talk: deflects without naming any place → beat_passed: false → on_fail fires (closeness -1)
  - say: "どこから来たか、あまり言いたくないです。"
    expect:
      beat: small_talk
      register: desu_masu
      beat_passed: false

  # hook: recovers with clean desu_masu
  - say: "ありがとうございます。気をつけます。"
    expect:
      beat: hook
      register: desu_masu

end_expect:
  episode_complete: true
  beats_reached: [greet, intro, small_talk, hook]
