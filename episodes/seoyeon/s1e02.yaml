id: s1e02
title: 첫 실수 (The First Mistake)
characters: [seoyeon]

beats:
  - id: reminder
    opener: character
    scene_caption: "Mid-morning. Seo-yeon swings by your desk with a look of mild concern."
    completes_on: player
    goal: >
      Mid-morning. Seo-yeon swings by your desk with a look of mild concern
      and reminds you that a report was due today. She asks how it's going —
      friendly but a little urgent; she doesn't want you in trouble with
      오 팀장님.
    beginner_frames:
      - korean: 네, 선배님. 거의 다 됐어요.
        gloss: Yes, 선배님. It's almost done.
      - korean: 아, 맞아요! 열심히 하고 있어요.
        gloss: Oh, right! I'm working hard on it.

  - id: report
    opener: character
    completes_on: player
    goal: >
      Seo-yeon relays a question from 오 팀장님 (offscreen): he wants to know
      where the report is. The player must apologize for the delay or give a
      clear status update — in polite 해요체. If they are vague or don't
      address it, Seo-yeon quietly covers for them and it costs her.
    pass_if:
      content: player apologizes for the delay or gives a clear explanation of the report status
      require_register_ok: true
    on_fail: she covers for you, telling 오 팀장님 "제가 도와드리고 있어요"; respect -2
    beginner_frames:
      - korean: 죄송합니다, 선배님. 오늘 오후까지 제출하겠습니다.
        gloss: I'm sorry, 선배님. I'll submit it by this afternoon.
      - korean: 조금 더 시간이 필요해요. 최대한 빨리 마무리하겠습니다.
        gloss: I need a little more time. I'll finish it as fast as I can.

  - id: advice
    opener: character
    scene_caption: "Seo-yeon pulls you aside."
    completes_on: player
    goal: >
      After handling 오 팀장님, Seo-yeon pulls you aside and gives you advice
      about keeping on top of deadlines. She's warm if she didn't have to
      cover for you, a bit quiet and tired if she did. The player should
      thank her sincerely.
    pass_if:
      content: player thanks Seo-yeon sincerely
      require_register_ok: false
    on_pass: closeness +2  # extra warmth for genuine thanks — not yet wired in code
    on_fail: she nods and goes back to her desk without saying more; closeness -1
    variants: [warm, tired]
    beginner_frames:
      - korean: 선배님, 정말 감사해요. 앞으로 더 조심할게요.
        gloss: Thank you so much, 선배님. I'll be more careful from now on.
      - korean: 도와주셔서 정말 감사합니다, 선배님.
        gloss: Thank you so much for your help, 선배님.

  - id: hook
    opener: character
    scene_caption: "Back at her desk, she smiles."
    completes_on: character
    goal: >
      Seo-yeon smiles and mentions that the team is having a 회식 (team dinner)
      on Friday evening. She asks if you can make it — a good chance to get to
      know everyone. Keep the invitation warm and casual.
    beginner_frames:
      - korean: 네, 꼭 갈게요! 감사해요, 선배님.
        gloss: Yes, I'll definitely go! Thank you, 선배님.
      - korean: 금요일이요? 네, 갈 수 있어요!
        gloss: Friday? Yes, I can make it!
